# npm Publishing Workflow for OxiLean WASM bindings
# Builds and publishes @cooljapan/oxilean to npm using wasm-pack

name: npm Publish

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - npm
      npm_tag:
        description: 'npm dist-tag (e.g., latest, beta, next)'
        required: false
        default: 'latest'
        type: string

  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: "0.13.1"
  SCOPE: "cooljapan"
  NPM_PACKAGE: "@cooljapan/oxilean"

jobs:
  build:
    name: Build WASM packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-build-

      - name: Install wasm-pack
        run: cargo install wasm-pack --version ${{ env.WASM_PACK_VERSION }} --locked || true

      - name: Install wasm-tools (for export-gate)
        run: cargo install wasm-tools --locked || true

      - name: Build for bundler target
        working-directory: crates/oxilean-wasm
        run: wasm-pack build --scope ${{ env.SCOPE }} --target bundler --out-dir pkg-bundler --release --features wasm

      - name: Build for web target
        working-directory: crates/oxilean-wasm
        run: wasm-pack build --scope ${{ env.SCOPE }} --target web --out-dir pkg-web --release --features wasm

      - name: Build for Node.js target
        working-directory: crates/oxilean-wasm
        run: wasm-pack build --scope ${{ env.SCOPE }} --target nodejs --out-dir pkg-node --release --features wasm

      - name: Verify WASM export count (bundler)
        run: |
          WASM_FILE=$(find crates/oxilean-wasm/pkg-bundler -maxdepth 1 -name "*.wasm" | head -1)
          bash web/scripts/export-gate.sh "$WASM_FILE" 10

      - name: Verify WASM export count (web)
        run: |
          WASM_FILE=$(find crates/oxilean-wasm/pkg-web -maxdepth 1 -name "*.wasm" | head -1)
          bash web/scripts/export-gate.sh "$WASM_FILE" 10

      - name: Verify WASM export count (node)
        run: |
          WASM_FILE=$(find crates/oxilean-wasm/pkg-node -maxdepth 1 -name "*.wasm" | head -1)
          bash web/scripts/export-gate.sh "$WASM_FILE" 10

      - name: WASM gzip size report
        working-directory: crates/oxilean-wasm
        run: |
          WASM_FILE=$(find pkg-bundler -maxdepth 1 -name "*.wasm" | head -1)
          RAW_BYTES=$(wc -c < "$WASM_FILE")
          RAW_KB=$((RAW_BYTES / 1024))
          GZIP_BYTES=$(gzip -c "$WASM_FILE" | wc -c)
          GZIP_KB=$((GZIP_BYTES / 1024))
          echo "=== WASM size report (bundler) ==="
          echo "  Raw size:  ${RAW_KB} KB  (${RAW_BYTES} bytes)"
          echo "  Gzip size: ${GZIP_KB} KB  (${GZIP_BYTES} bytes)"
          echo "(informational — no hard limit enforced for oxilean-wasm full IDE package)"

      - name: Copy hand-crafted TypeScript declarations into pkg directories
        working-directory: crates/oxilean-wasm
        run: |
          # The auto-generated .d.ts from wasm-bindgen uses snake_case names and
          # may not fully reflect the js_name= overrides in all wasm-pack versions.
          # The hand-crafted oxilean.d.ts at the crate root is the authoritative
          # TypeScript API surface; copy it alongside the generated file so npm
          # consumers can import the correct types.
          for dir in pkg-bundler pkg-web pkg-node; do
            if [ -d "$dir" ]; then
              cp oxilean.d.ts "${dir}/oxilean.d.ts"
              echo "Copied oxilean.d.ts into ${dir}/"
            fi
          done

      - name: Rename packages to @cooljapan/oxilean
        working-directory: crates/oxilean-wasm
        run: |
          for dir in pkg-bundler pkg-web pkg-node; do
            if [ -f "${dir}/package.json" ]; then
              sed -i "s|\"@${SCOPE}/oxilean-wasm\"|\"${NPM_PACKAGE}\"|g" "${dir}/package.json"
              echo "Updated ${dir}/package.json → ${NPM_PACKAGE}"
            fi
          done

      - name: Show package info
        working-directory: crates/oxilean-wasm
        run: |
          echo "=== bundler ==="
          cat pkg-bundler/package.json
          echo ""
          echo "=== web ==="
          cat pkg-web/package.json
          echo ""
          echo "=== node ==="
          cat pkg-node/package.json
          echo ""
          echo "=== WASM size ==="
          ls -lh pkg-bundler/*.wasm
          echo ""
          echo "=== bundler files ==="
          ls -la pkg-bundler/

      - name: Upload bundler package
        uses: actions/upload-artifact@v4
        with:
          name: npm-pkg-bundler
          path: crates/oxilean-wasm/pkg-bundler/

      - name: Upload web package
        uses: actions/upload-artifact@v4
        with:
          name: npm-pkg-web
          path: crates/oxilean-wasm/pkg-web/

      - name: Upload node package
        uses: actions/upload-artifact@v4
        with:
          name: npm-pkg-node
          path: crates/oxilean-wasm/pkg-node/

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download bundler package
        uses: actions/download-artifact@v4
        with:
          name: npm-pkg-bundler
          path: pkg-bundler

      - name: Show package contents
        run: |
          echo "=== package.json ==="
          cat pkg-bundler/package.json
          echo ""
          echo "=== Files ==="
          ls -la pkg-bundler/

      - name: Publish (dry-run)
        if: >-
          github.event.inputs.publish_target == 'dry-run' ||
          (github.event_name == 'push' && contains(github.ref, 'rc'))
        working-directory: pkg-bundler
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: >-
          github.event.inputs.publish_target == 'npm' ||
          (github.event_name == 'push' && !contains(github.ref, 'rc'))
        working-directory: pkg-bundler
        run: |
          NPM_TAG="${{ github.event.inputs.npm_tag || 'latest' }}"
          echo "Publishing ${NPM_PACKAGE} with tag: ${NPM_TAG}"
          npm publish --access public --tag "${NPM_TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        if: github.event.inputs.publish_target == 'npm' || (github.event_name == 'push' && !contains(github.ref, 'rc'))
        run: |
          sleep 10
          npm view ${{ env.NPM_PACKAGE }} version
