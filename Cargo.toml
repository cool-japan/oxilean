[workspace]
members = [
    "crates/oxilake",
    "crates/oxilean",
    "crates/oxilean-build",
    "crates/oxilean-cli",
    "crates/oxilean-codegen",
    "crates/oxilean-doc",
    "crates/oxilean-elab",
    "crates/oxilean-export",
    "crates/oxilean-kernel",
    "crates/oxilean-lint",
    "crates/oxilean-meta",
    "crates/oxilean-parse",
    "crates/oxilean-runtime",
    "crates/oxilean-std",
    "crates/oxilean-verify",
    "crates/oxilean-verify-wasm",
    "crates/oxilean-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxilean"
homepage = "https://github.com/cool-japan/oxilean"
documentation = "https://docs.rs/oxilean"
rust-version = "1.89"

[workspace.dependencies]
# Testing
proptest = "1.12.0"

# TOML parsing (used by oxilean-build workspace integration, oxilake)
toml = "0.8"

# Cryptography
tiny-keccak = { version = "2.0", features = ["keccak"] }

# SMT Solver (OxiZ - COOLJAPAN Pure Rust SMT solver, replaces Z3)
oxiz-solver = "0.3.4"
oxiz-math = "0.3.4"
num-bigint = { version = "0.4", default-features = false }
num-rational = { version = "0.4", default-features = false, features = ["num-bigint"] }

# Compression (OxiARC - COOLJAPAN Pure Rust compression, replaces flate2/zip/zstd)
oxiarc-deflate = "0.4.2"

# Internal dependencies
oxilean-kernel = { path = "crates/oxilean-kernel", version = "0.1.4" }
oxilean-export = { path = "crates/oxilean-export", version = "0.1.4" }
oxilean-meta = { path = "crates/oxilean-meta", version = "0.1.4" }
oxilean-parse = { path = "crates/oxilean-parse", version = "0.1.4" }
oxilean-elab = { path = "crates/oxilean-elab", version = "0.1.4" }
oxilean-codegen = { path = "crates/oxilean-codegen", version = "0.1.4" }
oxilean-runtime = { path = "crates/oxilean-runtime", version = "0.1.4" }
oxilean-std = { path = "crates/oxilean-std", version = "0.1.4" }
oxilean-lint = { path = "crates/oxilean-lint", version = "0.1.4" }
oxilean-build = { path = "crates/oxilean-build", version = "0.1.4" }
oxilean-verify = { path = "crates/oxilean-verify", version = "0.1.4" }
oxilean-verify-wasm = { path = "crates/oxilean-verify-wasm", version = "0.1.4" }
oxilean-wasm = { path = "crates/oxilean-wasm", version = "0.1.4" }

# WASM glue for the oxilean-verify-wasm "Kernel in a Tab" shim. Non-optional
# there (that crate exists only for wasm); listed here for a single version pin.
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
serde-wasm-bindgen = "0.6.5"
# getrandom 0.3 / 0.4 both appear in the wasm32 graph (oxilean-wasm)
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# CLI / serialization / error handling / misc
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"

# Dev-only: temp dirs and benchmarking
tempfile = "3.27"
criterion = { version = "0.8", features = ["html_reports"] }

# Serialization (OxiCode - COOLJAPAN Pure Rust serialization, replaces bincode)
oxicode = { version = "0.2.6" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# Size-first override for the "Kernel in a Tab" wasm cdylib. opt-level = "z"
# minimises the .wasm; the rest of the workspace keeps opt-level = 3 for native
# speed. (On wasm32 there is no stack unwinding, so panic already aborts without
# unwinding tables; wasm-pack + wasm-opt -Oz do the remaining size work.) Only
# this leaf crate's own codegen is affected — the kernel/export/verify code it
# pulls in still monomorphizes here, but the size pass runs over the whole module.
[profile.release.package.oxilean-verify-wasm]
opt-level = "z"

# Root package for workspace-level tests
[package]
name = "oxilean-workspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[[test]]
name = "mathlib_compat_test"
path = "tests/mathlib_compat_test/mod.rs"

[[test]]
name = "mathlib_theorems_test"
path = "tests/mathlib_theorems_test/mod.rs"

[[test]]
name = "std_library_test"
path = "tests/std_library_test/mod.rs"

[[test]]
name = "formal_proofs_test"
path = "tests/formal_proofs_test/mod.rs"

[[test]]
name = "cli_test"
path = "tests/cli_test.rs"

[[test]]
name = "perf_test"
path = "tests/perf_test.rs"

[dev-dependencies]
oxilean-kernel = { path = "crates/oxilean-kernel" }
oxilean-parse = { path = "crates/oxilean-parse" }
oxilean-elab = { path = "crates/oxilean-elab" }
