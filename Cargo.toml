# Standalone (NOT a member of the main leo4 workspace).
[workspace]

[package]
name        = "leo4-lean4-parse"
version     = "0.0.0"
edition     = "2024"
rust-version = "1.95"
license     = "Apache-2.0"
authors     = ["윤병익 <yeun0908@gmail.com>"]
repository  = "https://github.com/Honey-Be/leo4"
description = "PEG-based Lean 4 parser for leo4-oxilean-build. Strict superset of `oxilean-parse` v0.1.2's accepted surface (where overlapping). Built from scratch to escape the upstream parser's narrow subset of Lean 4 syntax."

[dependencies]
# PEG-based parser generator. Cleaner grammar definition than
# hand-written recursive descent; trivial to extend for new
# surface forms without restructuring.
peg = "0.8"

# leo4 canonical error type — every parse failure surfaces as
# a `LeanError` for uniform CLI / lib error propagation.
leo4-abi = { path = "../../crates/leo4-abi" }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
# Product names appear in docs unbracketed.
doc_markdown = "allow"

[dev-dependencies]
oxilean-parse = "0.1.2"
