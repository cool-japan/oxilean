# Standalone — NOT a member of any outer workspace. Builds
# from inside the `cool-japan/oxilean` (or fork) tree at
# `oxilean-parse-peg/`.
[workspace]

[package]
name        = "oxilean-parse-peg"
version     = "0.1.3"
edition     = "2024"
rust-version = "1.95"
license     = "Apache-2.0"
authors     = ["윤병익 <yeun0908@gmail.com>", "COOLJAPAN OU (Team Kitasan)"]
repository  = "https://github.com/cool-japan/oxilean"
description = "PEG-based Lean 4 parser for OxiLean. Strict superset of `oxilean-parse` v0.1.2's accepted surface (where overlapping). Built from scratch to escape the upstream parser's narrow subset of Lean 4 syntax. Donated upstream by the leo4 project (OX7, 2026-05-26)."

[dependencies]
# PEG-based parser generator. Cleaner grammar definition than
# hand-written recursive descent; trivial to extend for new
# surface forms without restructuring.
peg = "0.8"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
# Product names appear in docs unbracketed.
doc_markdown = "allow"

[dev-dependencies]
oxilean-parse = "0.1.2"
