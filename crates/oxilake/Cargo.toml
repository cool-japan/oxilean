[package]
name = "oxilake"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Package manager for OxiLean (Lean4-compatible) projects"
keywords = ["lean", "package-manager", "build-tool", "proof-assistant"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "oxilake"
path = "src/main.rs"

[dependencies]
oxilean-build = { workspace = true }
oxilean-elab = { workspace = true }
oxilean-kernel = { workspace = true }
oxilean-parse = { workspace = true }
oxilean-std = { workspace = true }
oxicode = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
