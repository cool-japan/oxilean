[package]
name = "oxilean-export"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "lean4export NDJSON reader feeding the oxilean-verify trusted computing base"
categories = ["development-tools", "parser-implementations", "science"]
keywords = ["lean4", "lean", "proof", "ndjson", "parser"]

[dependencies]
# ONLY the kernel — this crate is inside the TCB. No external runtime deps.
oxilean-kernel = { workspace = true }

[features]
default = []
# Build the kernel so that it tracks the depth of its terms and can enforce a
# limit on it (`oxilean_kernel::fuel::set_term_depth_limit`); see the
# kernel's feature of the same name.
term-depth = ["oxilean-kernel/term-depth"]

[lints.rust]
unsafe_code = "forbid"

# The cargo lints of [workspace.lints.cargo]; this crate keeps its own
# [lints.rust], so it cannot inherit [workspace.lints].
[lints.cargo]
redundant_homepage = "allow"
