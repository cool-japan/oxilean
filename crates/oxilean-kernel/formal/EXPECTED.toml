# Machine-readable mirror of the "Measured L1 verdict" doc comment on every
# `#[harness]` entry point in this package, in exactly the format
# `cargo-formal`'s own `examples/checked-arith/EXPECTED.toml` and the sibling
# `oxiarc/formal` and `oxicode/formal` packages use.
#
# **MEASURED, not predicted** (2026-09-14, release `cargo-formal` 0.1.0 CLI
# rebuilt from the current tree, release `formal-driver` with dependency-body
# lowering (D1) and on-demand monomorphic instance lowering (D2), OxiZ 0.3.3,
# rustc nightly-2026-06-20, `--jobs 4`, a fresh `--target-dir`, machine
# otherwise idle). The run lowered **24 dependency bodies (22 reachable)** and
# 0 monomorphic instances, checked **188 VCs (0 cached) over 190 obligations**
# in **615 s**, and exited **0** -- exit 0 because nothing is `refuted` here,
# not because everything is decided. No verdict below was written before the
# run that produced it.
#
# This file replaces the 2026-09-08 wave-3 version wholesale. That file carried
# five `"harness" = "unsupported"` rows; three of those harnesses are no longer
# refused by the encoder and are broken out here into 33 property rows (3 for
# `to_u32`, 11 for `cmp`, 19 for `sub`), which is why 42 rows became 72 -- see
# "What Phase 2b closed" at the end of this header.
#
# Naming. A property key is the word the **encoder actually mints**, never a
# description:
#
#   * a user-written `oxiformal::assert(..)` is `assert`; a second distinct
#     assertion raised at the *same* source site is `assert-2`, a third
#     `assert-3`, and so on. The same suffixing applies to every other key
#     (`arith-overflow-2`, `bounds-check-8`, `slice-range-2`, ...), and those
#     suffixed forms are **separate rows**, not variants of the base row.
#   * an `#[ensures]` clause checked through `#[proof_for_contract]` is
#     `ensures`, and is reported under layer `contract`. This package has none.
#   * everything else is the design section 9 closed vocabulary MIR's own
#     inserted checks produce: `arith-overflow`, `shift-overflow`,
#     `bounds-check`, `division-by-zero`, `remainder-by-zero`,
#     `division-overflow`, `neg-overflow`, `unwrap`, `expect`, `panic`,
#     `slice-range`, `unwinding-assertion`. A bare `debug_assert!` with no
#     format arguments lowers to `core::panicking::panic`, so its key is
#     `panic`; a `debug_assert_eq!` lowers to `core::panicking::assert_failed`
#     and its key is `assert`. Both occur in this run, inside `sub_limbs` --
#     see the note on `sub_is_truncating_and_ble_agrees_harness` below.
#   * the pseudo-key `harness` is a **whole-harness** verdict and nothing else:
#     `"proved"` means "no obligation of this harness is anything but proved"
#     (including a harness that raises none at all), and `"unsupported"` covers
#     both `Verdict::Unsupported` and `Verdict::Unverifiable`. It is used here
#     only for the two harnesses the encoder refuses whole, which mint no
#     verification condition at all.
#
# What is listed. Every obligation the harness is *about* -- its `assert`s,
# plus its `unwinding-assertion` where it has one -- and every incidental
# MIR-inserted check whose verdict is **not** `proved`. In this run that is
# every property group of every encoding harness: there is no group all of
# whose sites are `proved`, so nothing is omitted for being uninformative. The
# three `proved` obligations the run does report (see the tally) each share a
# row with a site that times out.
#
# Keying rule. `[harness.expected]` is a map, so several obligations of one
# harness that carry the same property name at *different* source sites share
# one row. The row records the **worst** of their verdicts (`refuted` >
# `timeout` > `unknown` > `unsupported`/`unverifiable` > `proved`), and every
# row below carries a comment giving the site count and the per-site
# breakdown, in the form "N sites: file:line:col=class, ...", contracted to
# "N sites: <sites> -- all <class>" where every site agrees. `class` is one of
# `timeout`, `model-rejected` (an `unknown` whose message is
# `solver-model-rejected`), `bounded` (an `unknown` whose message is
# `bounded: unwind=8 reached at ...`) and `proved`. All 70 property rows carry
# that breakdown, uniform ones included; the two `harness` pseudo-rows carry
# the encoder's refusal message instead, since they have no sites. 10 rows have
# sites whose class disagrees, and 7 of those 10 disagree in the recorded
# verdict *kind* as well -- those 7 are the rows where reading the row alone
# would lose information.
#
# Measured tally (2026-09-14): **72 property rows over 11 harnesses -- 0 proved
# / 0 refuted / 44 unknown / 26 timeout / 2 unsupported.** The run's own layer
# counters, which include the three incidental `proved` obligations no row can
# show, are:
#
#   hygiene   PASS (2 files scanned, 0 errors, 0 warnings, 0 notes,
#             0 unsafe sites)
#   bmc       3 proved / 0 refuted / 118 unknown / 67 timeout /
#             2 unsupported(iterator,width) / 0 unverifiable over 190
#             obligations; evidence: reproduction 188 (the two whole-harness
#             `unsupported` refusals mint no `vc/NNNN.smt2`)
#   contract  0 proved / 0 refuted (this package has no
#             `#[requires]`/`#[ensures]`)
#   theorem   not run
#   coverage  0 of 0 public functions annotated, 11 harnesses
#   solver-model-rejected: 25
#   dependency bodies  24 lowered (22 reachable)
#   audit     `unverifiable_by_reason` is **empty**, where the wave-3 file
#             recorded 11 `unverifiable(raw-pointer)` items. The emptiness is
#             measured here; cargo-formal's CHANGELOG attributes it to the
#             Phase 2b fix that stops the inventory's classifying type walk
#             before the private fields of `Vec` and the other containers the
#             encoder models as values
#
# The 118 `unknown`s split, by message, into **25 `solver-model-rejected`** and
# **93 `bounded: unwind=8 reached`**; there is no third reason. All 67
# `timeout`s are the 30 000 ms budget of `[package.metadata.formal] budget`.
#
# ## LOAD SENSITIVITY -- read this before calling a re-run a regression
#
# The `unknown`/`timeout` boundary in this package is a **wall-clock** boundary,
# not a property of the verification conditions, and it moves with machine load.
# Five runs of the same source with the same pins:
#
#   | run                                                    | unknown | timeout | wall  |
#   |---------------------------------------------------------|---------|---------|-------|
#   | 2026-09-09, quiet (Gate 5)                               | 124     | 61      | 556 s |
#   | 2026-09-14, concurrent load                              | 101     | 84      | 758 s |
#   | 2026-09-14, quiet (**the 72 rows below record this run**)| 118     | 67      | 615 s |
#   | 2026-09-15, Phase 3 defaults, moderate load (D-wave run1)| 159     | 26      | 411 s |
#   | 2026-09-15, Phase 3 defaults, moderate load (D-wave run2)| 147     | 38      | 451 s |
#
# In all five: 3 proved, **0 refuted**, 2 unsupported, 190 obligations.
#
# The movement is **asymmetric and bounded**: an obligation can only trade
# `unknown` for `timeout` and back. It can never become `proved` or `refuted`
# under a different load, because `bounded`/`solver-model-rejected` is a real
# answer from the solver and `timeout` is the absence of one -- neither is a
# decision about the property. So a re-run that reports a different split is
# reproducing this file, not contradicting it.
#
# The 2026-09-15 Phase 3 re-measurement (autoharness off, modular on, vacuity
# check on, --jobs 4; release cargo-formal 0621fc0, OxiZ 0.3.3, rustc
# nightly-2026-06-20) reproduces the file under the same asymmetry: run twice
# from fresh --target-dirs, item set identical (0 added/removed ids against
# the 2026-09-14 quiet report), 0 FLIPs in either direction (`--prev`
# run1<->run2: 12 UNDECIDED-SWAP, 0 FLIP; run1<->2026-09-14 quiet: 41
# UNDECIDED-SWAP, 0 FLIP), and `compare_expected.py --undecided-equivalent`
# exits 0 against this file for both runs. The machine was NOT quiet for this
# pair (other agents' cargo/nextest jobs ran throughout on the shared 8-core
# host, 1-min load ~13-14); the run is faster and more unknown-heavy than the
# quiet 2026-09-14 row (25 solver-model-rejected of its 118 unknown),
# consistent with contention making the solver give up
# (bounded/solver-model-rejected) before the 30000 ms wall clock rather than
# after it -- it does not change any decided verdict. solver-model-rejected
# was 28 (run1) and 27 (run2), against this file's 25; per the rule above,
# this count also moves only with timeouts on the same sites, so 27-28 is
# read as the same phenomenon at a different point in the unknown/timeout
# split, not a new class of rejection.
#
# New report surface, not a verdict: `items[].holes[]` (absent from the
# 2026-09-14 report; the field did not exist yet) now carries 553 entries in
# both 2026-09-15 runs, all one `(kind, message)` pair --
# `("assume", "drop-elided: \`oxilean_kernel::BigNat\` is dropped without
# running glue")`. This is the documented Drop rule of design phase3.md
# section 5.5 (`crates/formal-vcgen/src/symex/term.rs:367-407`): `BigNat` has
# no user `Drop` impl and is not "obviously trivial" (it owns a heap field),
# so its drop is assumed rather than modeled; a type with a genuine user
# `Drop` impl is refused outright instead. It is not the `modular`/`trusted`
# hole class design section 8 anticipates for this wave (neither marker
# string appears anywhere in this report), reproduces identically in both
# runs, and moves no verdict -- read it as a pre-existing rule newly visible
# through a new report field, not as new encoder behaviour.
#
# What is therefore a **stable** claim, and what is not:
#
#   * STABLE: `refuted` is 0, in every run. That is the claim this package
#     exists to make (see README.md, "Self-host highlight").
#   * STABLE: the two `"harness" = "unsupported"` rows. Both are encoder-time
#     refusals decided before any solve (`time_ms` 0), so no budget touches
#     them.
#   * STABLE: the three `proved` obligations. They are decided in 115 ms,
#     196 ms and 236 ms, three orders of magnitude inside the budget.
#   * STABLE: `sub_is_truncating_and_ble_agrees_harness` came back 1 proved /
#     55 timeout / 1 unknown in **all three** runs -- its rows below are the
#     ones a re-run is least likely to move.
#   * NOT STABLE: any individual `unknown` vs `timeout` row, including which
#     of `cmp_matches_lexicographic_order_harness`'s and
#     `shr_is_a_power_of_two_division_harness`'s rows carry which. Only the
#     aggregate 0-refuted claim above survives a change of load; the per-row
#     split is a measurement of this machine on this day.
#
# The rows nearest the boundary, with the solve times this run measured, so a
# reader can see which way each would move first:
#
#   * `unknown` that nearly timed out: `cmp#bounds-check-5`
#     (29 012 ms at `../src/bignat/mod.rs:493:15`, 25 410 ms at `:493:25`),
#     `shr#slice-range-2` (26 840 ms), `shr#assert`'s model-rejected site
#     (26 649 ms), `cmp#bounds-check-4` (22 916 ms / 21 146 ms),
#     `shr#arith-overflow-2` (23 423 ms), `shr#arith-overflow`'s
#     model-rejected site (20 912 ms).
#   * `timeout` that the quieter 2026-09-09 run decided: the seven single-site
#     `sub#arith-overflow-2` .. `sub#arith-overflow-8` rows and `sub#panic`
#     are the obvious candidates -- that run had 6 fewer timeouts than this
#     one over the same 190 obligations.
#
# ## Why there is still no `proved` *row*
#
# The run reports **3 proved obligations and 0 proved rows**, and those are
# different statements. All three proved obligations
# (`shr#unwinding-assertion` at `../src/bignat/mod.rs:405:13` and at
# `src/harness.rs:363:5`, `sub#unwinding-assertion` at
# `../src/bignat/mod.rs:480:9`) share their row with a site that times out, and
# the worst-of-sites rule records the row as `timeout`. The `proved` column of
# the tally above is therefore 0 by construction, not because nothing was
# decided.
#
# Of the 187 obligations that are not proved, 2 are the whole-harness encoder
# refusals of the next section. The remaining 185 -- the ones a solver was
# actually asked about -- split into exactly three causes:
#
#   * **25 `solver-model-rejected`** -- OxiZ 0.3.3 returns a model that does
#     not satisfy the verification condition (upstream item U-Z10).
#     cargo-formal runs a **mandatory model check** on every reported
#     counterexample, so such an answer becomes `unknown` and never a `refuted`
#     with a fabricated witness. Every `unwinding-assertion` this package
#     raises for `BigNat::from_limbs`'s `while limbs.last() == Some(&0)`
#     normalisation loop (`../src/bignat/mod.rs:78:15`) is one of them in the
#     six harnesses that do not time out on it; in the other three (`cmp`,
#     `sub`, `shr`) that same obligation is a `timeout` instead. U-Z10 is
#     fixed in the
#     `../oxiz` 0.3.4 working tree (unreleased); cargo-formal keeps
#     `oxiz = "=0.3.3"` until a release carrying the fix passes
#     `crates/formal-conformance`, so these rows are *expected* to move when
#     the pin moves -- an expectation, not a measurement: no 0.3.4 run of this
#     package has been made.
#   * **93 `bounded: unwind=8 reached`** -- the truncated-path answer: the
#     encoder could not conclude that some loop finished, so every obligation
#     on the truncated path is reported `bounded`. *Which* loop is named in the
#     message, and this run splits the 93 three ways. **Do not** read the
#     wave-3 file's blanket "the `bounded` column is a consequence of U-Z10"
#     onto all of them; it covers only the first group.
#       - **18** name `../src/bignat/mod.rs:78:15`, `from_limbs`'s
#         normalisation loop. These are the ones downstream of the model
#         rejections above: that loop's own `unwinding-assertion` is
#         `solver-model-rejected` wherever it is not itself a timeout. Measured
#         on 2026-09-08 by re-running
#         `as_limbs_and_the_predicates_agree_harness` at `--unwind 16`:
#         verdict-for-verdict identical, only the number in the message
#         changed. Not repeated on this run's binaries.
#       - **42** name `:398:18`, `shr_bits`'s limb loop, and **33** name
#         `:492:14`, `cmp_limbs`'s reverse walk. Both of those loops' own
#         `unwinding-assertion`s are `timeout` in this run, not model-rejected,
#         so these 75 sit downstream of the 30 000 ms budget rather than of the
#         pin. The wave-3 experiment never covered them: neither of the two
#         harnesses that raise them encoded at all when it was written.
#   * **67 `timeout`** at 30 000 ms -- concentrated in the three harnesses that
#     walk two symbolic limb vectors through `cmp_limbs`
#     (`../src/bignat/mod.rs:492:14`'s reverse loop) and `sub_limbs`
#     (`:476:14`'s borrow loop): 55 in
#     `sub_is_truncating_and_ble_agrees_harness`, 8 in
#     `cmp_matches_lexicographic_order_harness`, 4 in
#     `shr_is_a_power_of_two_division_harness`. These are genuinely hard
#     bit-blasting problems, not a solver defect and not an encoder refusal.
#
# ## The 2 `unsupported` harnesses
#
# Both are whole-harness refusals decided at encoding time, and both are
# statements about cargo-formal, not about `oxilean-kernel`:
#
#   * `add_reaches_the_u128_carry_harness` -- `unsupported(width)`, **Rule W**:
#     no SMT term wider than 64 bits, because the pinned solver mis-encodes
#     wide `bvsub`/`bvneg` and can return a false `unsat`, the one wrong answer
#     no model check can catch. `add_limbs`'s carry is
#     `u128::from(long[i]) + ...` (`../src/bignat/mod.rs:459:17`). The same
#     refusal covers `add_u64`, `succ`, `mul`, `mul_u64`, `div`, `rem`, `pow`
#     and `checked_shl`.
#   * `bitwise_ops_respect_the_limb_count_lattice_harness` --
#     `unsupported(iterator)` at `land`'s `(0..n).map(..).collect()`
#     (`../src/bignat/mod.rs:296:29`): `map`/`collect` build or advance an
#     iterator outside the bounded model (cargo-formal TODO P3-23).
#     `lor`/`lxor`'s `out.iter_mut().zip(short.iter())` (`:308`, `:322`) is the
#     same gap one call later; the harness aborts at the first.
#
# ## What Phase 2b closed since the wave-3 (2026-09-08) file
#
# Three harnesses that were whole-harness `unsupported` then now encode
# completely, which is why this file has 72 rows where the old one had 42 and
# why the run grew from 86 VCs to 188:
#
#   * `to_u32_agrees_with_to_u64_harness` was `unsupported(no-body)`
#     ("`BigNat::to_u32::{closure-0}` is not in the module set"). **P2-13**
#     lowers closures a dependency only ever passes as a value, hooked at the
#     single place a closure path is minted, so `to_u64().and_then(|n| ..)` no
#     longer reports `no-body`. Now 6 obligations, all `unknown`.
#   * `cmp_matches_lexicographic_order_harness` was `unsupported(aliasing)`
#     ("a reference to a symbolically indexed element") at `cmp_limbs`'s
#     `a[i].cmp(&b[i])` (`../src/bignat/mod.rs:493:15`). The encoder builtin
#     "shared `&xs[i]` at a symbolic index resolving to the selected element's
#     value" closed it. Now 40 obligations, 32 `unknown` / 8 `timeout`.
#   * `sub_is_truncating_and_ble_agrees_harness` was
#     `unsupported(unsupported-rvalue)` ("a reference has no field") at
#     `cmp_limbs`'s `a.len()` (`:489:8`), reached through `ble`'s
#     `self <= rhs` on `&BigNat`. The ordering fallback to a user
#     `PartialOrd`/`Ord` impl, wired into `lt`/`le`/`gt`/`ge` as well as `cmp`
#     and `partial_cmp`, closed it. Now 57 obligations, 55 `timeout` /
#     1 `unknown` / 1 **proved**.
#
# That last harness is also the one that produces this package's first `panic`
# and its first non-harness `assert` rows: it now reaches `sub_limbs`'s own
# internal debug assertions, `debug_assert!(cmp_limbs(a, b) != Ordering::Less)`
# at `../src/bignat/mod.rs:473` (key `panic`, raised at
# `core/src/macros/mod.rs:290:13`) and `debug_assert_eq!(borrow, 0)` at `:483`
# (key `assert`, raised at `core/src/macros/mod.rs:51:21`). Those are exactly
# the two contracts README.md's in-source-candidate table proposes for
# `sub_limbs`; the package now *raises* them as obligations instead of merely
# proposing them. Both time out on this run.
#
# `shr_is_a_power_of_two_division_harness` encoded in wave 3 too, but with 9
# timeouts; it has 4 here, and three of its rows moved `timeout` -> `unknown`.
# The encoder gained strength reduction of `/` and `%` by a constant power of
# two in Phase 2b, which is the ask the wave-3 file recorded for
# `shr_bits`'s `bits / 64` and `bits % 64` (`../src/bignat/mod.rs:391`,
# `:392`). Note what did **not** change: both checks are still raised
# (`division-by-zero` at `:391:26`, `remainder-by-zero` at `:392:25`, both
# `bounded`), because MIR inserts them regardless of how the operation is
# encoded. The evidence here is the row movement and the wall clock, not the
# shape of the SMT terms -- and see the LOAD SENSITIVITY section before
# attributing all of it to the encoder.
#
# Reproduce with, from this directory:
#
#   FORMAL_DRIVER=<path>/formal-driver cargo formal check

