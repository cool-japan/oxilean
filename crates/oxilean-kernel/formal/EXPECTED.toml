# Machine-readable mirror of the "Measured L1 verdict" doc comment on every
# `#[harness]` entry point in this package, in exactly the format
# `cargo-formal`'s `examples/checked-arith/EXPECTED.toml` uses.
#
# **MEASURED, not predicted** (2026-09-08, release `cargo-formal` CLI + release
# `formal-driver` with dependency-body and monomorphic-instance lowering, SMT
# backend OxiZ 0.3.3). Nothing in this file was written before the run that
# produced it.
#
# Naming. A property key is the word the **encoder actually mints**, never a
# description:
#
#   * a user-written `oxiformal::assert(..)` is `assert`; a second distinct
#     assertion raised at the *same* source site is `assert-2`, a third
#     `assert-3`, and so on.
#   * an `#[ensures]` clause checked through `#[proof_for_contract]` is
#     `ensures`, and is reported under layer `contract`. This package has none.
#   * everything else is the closed vocabulary MIR's own inserted checks
#     produce: `arith-overflow`, `shift-overflow`, `bounds-check`,
#     `division-by-zero`, `remainder-by-zero`, `division-overflow`,
#     `neg-overflow`, `unwrap`, `expect`, `panic`, `slice-range`,
#     `unwinding-assertion`.
#   * the pseudo-key `harness` is a **whole-harness** verdict and nothing else:
#     `"proved"` means "no obligation of this harness is anything but proved"
#     (including a harness that raises none at all), and `"unsupported"` covers
#     both `Verdict::Unsupported` and `Verdict::Unverifiable`.
#
# What is listed. Every obligation the harness is *about* — its `assert`s, plus
# its `unwinding-assertion` where it has one — and every incidental
# MIR-inserted check whose verdict is **not** `proved`. Incidental checks that
# came out `proved` are deliberately not enumerated: they carry no information,
# and listing them would make this file a copy of `report.json` rather than a
# statement of intent. In this package exactly two obligations are `proved`,
# and both are `unwinding-assertion` sites inside
# `shr_is_a_power_of_two_division_harness`, whose row is nonetheless `timeout`
# under the keying rule below.
#
# Keying rule. `[harness.expected]` is a map, so several obligations of one
# harness that carry the same property name at *different* source sites share
# one row. The row records the **worst** of their verdicts (`refuted` >
# `timeout` > `unknown` > `unsupported`/`unverifiable` > `proved`), and where
# the sites disagree a row comment says how many sites there are and how the
# others came out. Eight rows in this file use that rule; every one of them is
# annotated.
#
# Measured tally (2026-09-08): 42 rows over 11 harnesses —
# 0 proved / 0 refuted / 31 unknown / 6 timeout / 5 unsupported. The run's own
# layer counters, over 86 VCs and 91 obligations, are: bmc 2 proved /
# 0 refuted / 75 unknown / 9 timeout / 5 unsupported / 0 unverifiable;
# contract 0 proved / 0 refuted; hygiene PASS (2 files, 0 warnings, 0 unsafe
# sites); audit reports 11 `unverifiable(raw-pointer)` items, all inside the
# lowered dependency bodies, none in a harness. `dependency bodies: 22 lowered
# (22 reachable)`. `solver-model-rejected: 17`.
#
# Those counters are from a **cold** run (fresh `--target-dir`, `0 cached`),
# which is how this file was verified: all 42 rows below were checked
# mechanically against that run's `report.json` and 0 disagree. A **warm**
# re-run — where every non-timeout obligation is served from the cache and only
# the timeouts are re-solved — reports 76 unknown / 8 timeout and
# `solver-model-rejected: 18` instead, because one borderline obligation of
# `shr_is_a_power_of_two_division_harness` finishes inside 30 s when it is not
# competing with 85 other solves. **No row below changes**: that obligation
# shares its `assert` row with a site that is `timeout` either way.
#
# ## Why there is no `proved` row
#
# The 75 `unknown` obligations split into exactly two reasons, and the second
# is a *consequence* of the first — this was measured, not assumed:
#
#   * **17** are `solver-model-rejected` — OxiZ 0.3.3 returns a model that does
#     not satisfy the verification condition (upstream item U-Z10).
#     cargo-formal's mandatory model check refuses every one, so no fabricated
#     counterexample is ever reported. **Every `unwinding-assertion` this
#     package raises for `BigNat::from_limbs`'s `while limbs.last() == Some(&0)`
#     normalisation loop (`../src/bignat/mod.rs:78:15`) is one of them.**
#   * **58** are `bounded: unwind=N reached`. These are *not* a bound that is
#     too small. Because the loop's own `unwinding-assertion` is
#     `solver-model-rejected` (above), the encoder cannot discharge "the loop
#     finished", so every obligation on the truncated path is reported
#     `bounded`. Verified by re-running
#     `as_limbs_and_the_predicates_agree_harness` with `--unwind 16`: the
#     verdicts are identical and only the number in the message changes
#     (`bounded: unwind=16 reached at ../src/bignat/mod.rs:78:15`), while the
#     `unwinding-assertion` stays `solver-model-rejected`. Raising `unwind`
#     further cannot help; an OxiZ fix can.
#
# So the honest reading of this table is: **on this pin, no `BigNat` property
# that touches a normalised limb vector is decidable**, and the whole
# `unknown` column moves when cargo-formal's `oxiz` pin moves off `=0.3.3`.
#
# ## The 9 `timeout`s
#
# All nine are in `shr_is_a_power_of_two_division_harness` and all are the
# 30 000 ms budget of `[package.metadata.formal] budget`. `BigNat::shr_bits`
# computes `bits / 64` and `bits % 64` on a `u64` (`../src/bignat/mod.rs:391`,
# `:392`); the encoder emits full 64-bit bit-blasted division and remainder for
# both, on top of `bit_length`'s `leading_zeros` and an eight-fold unrolled
# limb loop. Strength-reducing a division by a power-of-two *constant* to a
# shift and a mask is the concrete encoder ask this harness produces.
#
# One of the nine is borderline at the 30 s budget — see the note on cold and
# warm runs above. It never changes a row in this file.
#
# ## The 5 `unsupported` harnesses
#
# Each names one distinct thing that stands between this package and a checked
# kernel bignum. None of them is a defect in `oxilean-kernel`.
#
#   * `add_reaches_the_u128_carry_harness` — `unsupported(width)`. Rule W: no
#     SMT term wider than 64 bits, because the pinned solver mis-encodes wide
#     `bvsub`/`bvneg` and can return a false `unsat`. `add_limbs`'s carry is
#     `u128::from(long[i]) + ...` (`../src/bignat/mod.rs:459:17`).
#   * `bitwise_ops_respect_the_limb_count_lattice_harness` —
#     `unsupported(iterator)` at `land`'s `(0..n).map(..).collect()`
#     (`:296:29`). `lor`/`lxor`'s `iter_mut().zip(..)` is the same gap one call
#     later; the harness aborts at the first.
#   * `cmp_matches_lexicographic_order_harness` — `unsupported(aliasing)`,
#     "a reference to a symbolically indexed element", at `cmp_limbs`'s
#     `a[i].cmp(&b[i])` (`:493:15`). The Phase 2b ordering fallback **does**
#     resolve `<BigNat as Ord>::cmp` to the user impl and inline it — the
#     refusal is three frames deeper, inside `cmp_limbs`.
#   * `sub_is_truncating_and_ble_agrees_harness` —
#     `unsupported(unsupported-rvalue)`, "a reference has no field", at
#     `cmp_limbs`'s `a.len()` (`:489:8`). Reached through `ble`'s
#     `self <= rhs` on `&BigNat`, i.e. through
#     `<&A as PartialOrd<&A>>::le`, which arrives at the user impl one
#     indirection deeper than the direct `.cmp()` call above does. Measured:
#     hoisting a direct `a.cmp(&b)` above the `ble` call in that harness moves
#     its reason to `aliasing` at `:493:15`, so the two refusals are distinct
#     and the statement order in the harness is deliberate.
#   * `to_u32_agrees_with_to_u64_harness` — `unsupported(no-body)`,
#     "`oxilean_kernel::bignat::BigNat::to_u32::{closure-0}` is not in the
#     module set" (`:115:9`). Dependency-body lowering does not reach closures
#     defined inside a dependency's body.
#
# Reproduce with, from this directory:
#
#   FORMAL_DRIVER=<path>/formal-driver cargo formal check

