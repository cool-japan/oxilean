[package]
name = "oxilean-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxilean-kernel"
description = "OxiLean kernel - The trusted computing base for type checking"
readme = "README.md"
keywords = ["theorem-prover", "lean", "type-theory", "kernel", "dependent-types"]
categories = ["science", "development-tools"]

[lib]
name = "oxilean_kernel"
path = "src/lib.rs"

[dependencies]
# ZERO external dependencies - this is the TCB (Trusted Computing Base)

[dev-dependencies]
# Test-only dependencies are allowed
criterion = { workspace = true }
proptest.workspace = true
# Differential-testing reference for the hand-written BigNat (never ships).
num-bigint.workspace = true

[features]
default = []
# Track the depth of every term, so that a limit on it can be enforced
# (`fuel::set_term_depth_limit`): a caller whose stack is small can then have
# a term too deep for it reported as a resource limit instead of overflowing
# the stack. Off by default: it adds four bytes to every shared subterm.
# (`oxilean-verify-wasm` turns it on — a browser's stack is about a megabyte.)
term-depth = []

[lints]
workspace = true
