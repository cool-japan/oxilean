[package]
name = "oxilean-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxilean-wasm"
description = "WebAssembly bindings for OxiLean"
readme = "README.md"
keywords = ["lean", "wasm", "webassembly", "type-theory", "browser"]
categories = ["wasm", "development-tools"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxilean-kernel = { workspace = true }
oxilean-parse = { workspace = true }
oxilean-elab = { workspace = true }
oxiarc-deflate = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Deliberately unreferenced in code: these only switch on getrandom's `wasm_js` feature for transitive dependencies on wasm32.
getrandom = { workspace = true }
getrandom_v04 = { workspace = true }

[features]
default = []
wasm = ["wasm-bindgen", "serde", "serde-wasm-bindgen"]

[dev-dependencies]

[lints]
workspace = true
