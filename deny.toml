# cargo-deny configuration for OxiLean
# Enforces the COOLJAPAN banned-crate policy (see ~/.claude/CLAUDE.md
# "Dependency Replacements"). Run: cargo deny check bans

[graph]
all-features = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "openblas-src", reason = "COOLJAPAN: use oxiblas" },
    { crate = "openblas-sys", reason = "COOLJAPAN: use oxiblas" },
    { crate = "openblas-build", reason = "COOLJAPAN: use oxiblas" },
    { crate = "bincode", reason = "COOLJAPAN: use oxicode" },
    { crate = "rustfft", reason = "COOLJAPAN: use oxifft" },
    { crate = "z3", reason = "COOLJAPAN: use oxiz" },
    { crate = "z3-sys", reason = "COOLJAPAN: use oxiz" },
    { crate = "rusqlite", reason = "COOLJAPAN: use oxisql-sqlite-compat" },
    { crate = "libsqlite3-sys", reason = "COOLJAPAN: use oxisql-sqlite-compat" },
    { crate = "zip", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "flate2", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "zstd", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "zstd-sys", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "zstd-safe", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "bzip2", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "bzip2-sys", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "lz4", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "lz4-sys", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "tar", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "snap", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "brotli", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "brotli-sys", reason = "COOLJAPAN: use oxiarc-*" },
    { crate = "miniz_oxide", reason = "COOLJAPAN: use oxiarc-*" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
